name: Generate Projects Card

on:
  schedule:
    - cron: "0 6 * * 0"   # weekly, Sunday 6am UTC
  workflow_dispatch:      # allow manual run
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate projects.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: vigneshsindhe
          EXCLUDE_FORKS: "true"
          MAX_REPOS: "8"
          OUTPUT_PATH: dist/projects.svg
        run: python scripts/generate_projects.py

      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
