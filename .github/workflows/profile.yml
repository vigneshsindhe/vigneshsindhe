name: Generate Profile Assets

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: vigneshsindhe
          outputs: |
            dist/snake-dark.svg?color_snake=green&color_dots=%230891B2,%23A78BFA,%2322D3EE,%2310B981,%230891B2,%23A78BFA,%2322D3EE
            dist/snake-light.svg?color_snake=green&color_dots=%230891B2,%23A78BFA,%2322D3EE,%2310B981,%230891B2,%23A78BFA,%2322D3EE

      - name: Generate projects.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: vigneshsindhe
          EXCLUDE_FORKS: "false"
          MAX_REPOS: "20"
          OUTPUT_PATH: projects/projects.svg
        run: python scripts/generate_projects.py

      - name: Copy projects.svg to dist
        run: cp projects/projects.svg dist/projects.svg

      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
