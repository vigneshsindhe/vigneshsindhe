<svg xmlns="http://www.w3.org/2000/svg" width="800" height="120" viewBox="0 0 800 120">
  <style>
    .snake-body { fill: none; stroke: #22D3EE; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
    .snake-head { fill: #10B981; }
    .snake-eye { fill: #0A101F; }
    @keyframes move {
      0% { transform: translateX(-200px); }
      100% { transform: translateX(800px); }
    }
    .snake-group { animation: move 8s linear infinite; }
  </style>
  <g class="snake-group">
    <path class="snake-body" d="M 0 60 Q 30 30 60 60 Q 90 90 120 60 Q 150 30 180 60 Q 210 90 240 60"/>
    <circle class="snake-head" cx="240" cy="60" r="12"/>
    <circle class="snake-eye" cx="246" cy="56" r="3"/>
  </g>
</svg>
